# ============================================================================
# Nginx configuration for the Platform application
# ============================================================================

server {
    listen 80 default_server;
    server_name _;

    location = /health/live/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host platform.example.com;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name ec2-54-90-203-106.compute-1.amazonaws.com 54.90.203.106 platform.example.com;

    client_max_body_size 10M;

    location /static/ {
        alias /var/lib/platform/static/;
        expires 30d;
        access_log off;
        # Removed immutable caching as per requirements
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Use $scheme for direct HTTP demo traffic
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
