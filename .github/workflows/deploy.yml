name: Deploy Platform
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U platform_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python manage.py check
          python manage.py test
        env:
          DJANGO_SECRET_KEY: "test-secret-key"
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DB_HOST: "localhost"
          DB_NAME: "platform_test"
          DB_USER: "platform_test"
          DB_PASSWORD: "ci_test_password_only"
          DB_SSLMODE: "disable"

  aws-auth:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::703983099689:role/GitHubActionsDeployRole
          aws-region: ap-south-1
      - name: Verify Authentication
        run: |
          echo "✅ Successfully authenticated to AWS using OIDC!"
          aws sts get-caller-identity
